<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forms Autofill</title>
    <style>
      body { width: 300px; font: 13px system-ui, sans-serif; margin: 12px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; margin-bottom: 6px; }
      label input { display: block; width: 100%; box-sizing: border-box; }
      #custom > div { display: flex; gap: 4px; margin-bottom: 4px; }
      #custom input { flex: 1; min-width: 0; }
      fieldset { margin: 8px 0; }
      #fill, #suggest, #download { width: 100%; padding: 6px; margin-top: 8px; }
      #mode label { display: inline; margin-right: 8px; }
      #fill-hint { margin: 4px 0 0; color: #5f6368; }
    </style>
  </head>
  <body>
    <h1>Forms Autofill</h1>
    <form id="profile">
      <label>Name <input name="name" autocomplete="off" /></label>
      <label>Email <input name="email" type="email" autocomplete="off" /></label>
      <label>Phone <input name="phone" type="tel" autocomplete="off" /></label>
      <label>College <input name="college" autocomplete="off" /></label>
      <label>Roll no. <input name="rollNo" autocomplete="off" /></label>
      <label>Department / branch <input name="department" autocomplete="off" /></label>
      <label>Year <input name="year" autocomplete="off" /></label>
      <label>Section <input name="section" autocomplete="off" /></label>
      <fieldset>
        <legend>Custom fields</legend>
        <div id="custom"></div>
        <button type="button" id="add">Add field</button>
      </fieldset>
    </form>
    <button type="button" id="fill" aria-describedby="fill-hint">Fill my details</button>
    <p id="fill-hint" hidden>Add your details first</p>
    <fieldset id="mode">
      <legend>Quiz suggestions</legend>
      <label><input type="radio" name="triggerMode" value="off" /> Off</label>
      <label><input type="radio" name="triggerMode" value="click" /> On click</label>
      <label><input type="radio" name="triggerMode" value="auto" /> Auto</label>
    </fieldset>
    <button type="button" id="suggest">Suggest answers</button>
    <button type="button" id="download" hidden>Download on-device AI</button>
    <p id="status" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
